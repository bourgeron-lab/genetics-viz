name: Publish to PyPI

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  # The full CI - lint, tests on every Python, the installed-wheel check - must
  # pass before anything reaches PyPI. Production installs from there.
  ci:
    uses: ./.github/workflows/ci.yml

  build-and-publish:
    name: Build and publish to PyPI
    needs: ci
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing

    steps:
    - uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v10.3.2
      with:
        python-version: '3.12'
        enable-cache: true

    - name: Check the tag matches the package version
      run: |
        version=$(uv run --no-project python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
        if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
          echo "::error::Tag ${GITHUB_REF_NAME} does not match pyproject.toml version ${version}"
          exit 1
        fi

    - name: Check the CHANGELOG has the version (the GitHub release's notes)
      run: python3 .github/scripts/release_notes.py "${GITHUB_REF_NAME}" > /dev/null

    - name: Build package
      run: uv build

    - name: Publish package to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1

  # The GitHub release, once the package is on PyPI: the CHANGELOG section as
  # notes. Its title is the annotated tag's message (`git tag -a v0.31.0 -m
  # "v0.31.0 — Short title"`), else the tag. Releases v0.16.0-v0.30.0 were
  # created by hand afterwards: this job did not exist.
  github-release:
    name: Create the GitHub release
    needs: build-and-publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-tags: true

    - name: Create the release from the CHANGELOG
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref_name }}
      run: |
        if gh release view "$TAG" > /dev/null 2>&1; then
          echo "Release $TAG exists already"
          exit 0
        fi
        python3 .github/scripts/release_notes.py "$TAG" > notes.md
        title="$TAG"
        if [ "$(git cat-file -t "refs/tags/$TAG")" = "tag" ]; then
          title=$(git tag -l --format='%(contents:subject)' "$TAG")
        fi
        gh release create "$TAG" --verify-tag --title "${title:-$TAG}" --notes-file notes.md
