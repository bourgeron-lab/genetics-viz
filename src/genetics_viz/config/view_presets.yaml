# View presets for variant dataframes
# Each preset defines a name, keywords for auto-selection, and a list of columns to display

presets:
  - name: "Standard View"
    keywords: ["default", "standard"]
    columns:
      - Variant
      - VEP_Consequence
      - VEP_SYMBOL
      - MOI
      - VEP_CLIN_SIG
      - fafmax_faf95_max_genomes
      - cohort_freq
      - seen_families
      - sample
      - FID
      - sample_gt
      - father_gt
      - mother_gt
      - Validation
      - Diagnostic

  # The De novo sub-tab with the denovo step's evidence (chosen by name, not keyword)
  - name: "De novo View"
    keywords: []
    columns:
      - Variant
      - VEP_Consequence
      - VEP_SYMBOL
      - MOI
      - VEP_CLIN_SIG
      - fafmax_faf95_max_genomes
      - cohort_freq
      - seen_families
      - sample
      - dnm_strict
      - dnm_flags
      - dnm_child_reads
      - dnm_child_vaf
      - dnm_father_alt
      - dnm_mother_alt
      - dnm_sibs
      - dnm_origin
      - dnm_recurrence
      - Validation
      - Diagnostic

  - name: "Recessive View"
    keywords: ["rare_homalt"]
    columns:
      - Variant
      - VEP_Consequence
      - VEP_SYMBOL
      - MOI
      - VEP_CLIN_SIG
      - fafmax_faf95_max_genomes
      - cohort_freq
      - seen_families
      - nhomalt_genomes
      - sample
      - FID
      - sex
      - sample_gt
      - father_gt
      - mother_gt
      - Validation
      - Diagnostic

  - name: "Missense View"
    keywords: ["rare_missense_plp", "rare_missense"]
    columns:
      - Variant
      - VEP_SYMBOL
      - MOI
      - VEP_CLIN_SIG
      - fafmax_faf95_max_genomes
      - cohort_freq
      - seen_families
      - MPC
      - REVEL
      - popEVE
      - am_pathogenicity
      - sample
      - FID
      - sample_gt
      - father_gt
      - mother_gt
      - Validation
      - Diagnostic

  - name: "SpliceAI View"
    keywords: ["rare_spliceai", "spliceai"]
    columns:
      - Variant
      - VEP_Consequence
      - VEP_SYMBOL
      - MOI
      - VEP_CLIN_SIG
      - fafmax_faf95_max_genomes
      - cohort_freq
      - seen_families
      - SpliceAI_maxDS
      - SpliceAI_symbol
      - sample
      - FID
      - sample_gt
      - father_gt
      - mother_gt
      - Validation
      - Diagnostic

  - name: "Mix View"
    keywords: ["default", "standard"]
    columns:
      - Variant
      - VEP_Consequence
      - VEP_SYMBOL
      - MOI
      - svlen
      - sample
      - sample_gt
      - father_gt
      - mother_gt
      - FID
      - wisecondorX
      - Validation
      - Diagnostic

  - name: "SV View"
    keywords: ["sv", "wisecondorx"]
    columns:
      - Variant
      - gene
      - svlen
      - sample
      - FID
      - wisecondorX
      - Validation
      - Diagnostic
