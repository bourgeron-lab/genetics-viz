# CNV coverage and SV read-evidence display settings.
#
# Consumed by utils/cnv_coverage.py, utils/sv_view.py and utils/sv_reads.py.
# The files themselves (bigWigs, panel.json, fit tables) are written by the
# ghfc-ngs cnv_coverage and cnv_panel steps; nothing here changes their
# meaning, only how they are drawn.

copy_number:
  # A bin is masked (drawn grey, not as a copy number) when the panel cannot
  # be trusted there: a median under this fraction of the expected ploidy
  # (segmental duplications, gaps, MAPQ-0 stretches) ...
  min_median_fraction: 0.5
  # ... or a spread across the controls above this fraction of the median.
  max_relative_mad: 0.35
  # Copy numbers above this are drawn at the cap.
  y_max: 5
  # Points drawn per sample. Wider regions are median-aggregated to this.
  display_points: 1500
  # Regions with more 250 bp bins than this are read through the bigWig zoom
  # levels instead of bin by bin (about 50 Mb).
  max_exact_bins: 200000
  # Smallest window drawn around an SV, so a short one keeps its flanks.
  min_window_bp: 20000
  colors:
    loss: "#d62728"
    neutral: "#4b5563"
    gain: "#2ca02c"
    masked: "#d1d5db"
    roi_loss: "rgba(255,0,0,0.12)"
    roi_gain: "rgba(0,128,0,0.12)"

# Which read view an SV gets: one window around the whole event, or one
# window per breakpoint.
read_view:
  # Same value is set as the igv.js alignment track's visibilityWindow, so the
  # switch and igv.js agree on what can be drawn in one window.
  visibility_window_bp: 30000
  # The single window is the SV span times this, centred on it.
  expansion: 1.6
  # Half-width of each breakpoint window in the split view, for a caller that
  # gives exact breakpoints, and for one that does not (WisecondorX calls sit
  # on 1 kb bins and can be off by more than that).
  flank_bp: 1500
  flank_bp_imprecise: 5000

read_evidence:
  # A pair is discordant by size beyond median + this many MADs of the
  # window's proper-pair insert sizes.
  discordant_insert_mads: 6
  # Fallback when a window has too few proper pairs to estimate the median.
  default_insert_max: 1000
  # Percentiles of the proper-pair inserts shaded as the expected band.
  insert_band: [2.5, 97.5]
  min_mapq: 1
  # A soft clip counts from this length, and a clipped position is drawn only
  # when at least this many reads are clipped there (one is usually noise).
  min_clip_bp: 20
  min_clip_reads: 2
  # Suggested breakpoints: clips and split-read junctions within this many bp
  # count together, and a side needs clips + 2 x split reads >= the score.
  breakpoint_tolerance_bp: 3
  min_breakpoint_score: 3
  # Clips and split reads whose orientation does not fit the SV type (a
  # deletion's start clipped before it, an inverted split on a deletion)
  # count for this fraction.
  mismatch_weight: 0.25
  # Discordant pairs needed before their breakpoint interval is drawn.
  min_interval_pairs: 2
  # Copy-number check of a suggested position (deletions and duplications
  # only): mean coverage this far on each side must differ by min_cn_step,
  # the right way. The same step, over at least min_step_bins bins on each
  # side, makes the approximate coverage position when the reads give none.
  cn_check_bp: 1000
  min_cn_step: 0.5
  min_step_bins: 6
  # Read depth bins for the fine copy-number line (2 x depth / the sample's
  # autosomal median), drawn over the panel-corrected CN.
  coverage_bin_bp: 25
  # How far above its read parts a split read's arc rises (factor on the
  # log insert axis at its top). The arc is half an ellipse: steep ends.
  arc_rise: 4
  # Colours follow igv.js's "pair orientation & insert size" scheme, so the
  # read panel and the IGV read view agree.
  colors:
    deletion: "#c80000" # +- with a larger insert than expected
    duplication: "#009600" # -+ (pair pointing outward)
    inversion_pp: "#009696" # ++
    inversion_mm: "#1432c8" # --
    interchromosomal: "#9c27b0"
    split: "#000000"
    split_inv: "#7c3aed"
    soft_clip: "#f59e0b"
    insert_band: "rgba(156,163,175,0.22)"
    copy_number: "#2563eb"
    copy_number_masked: "#d1d5db"
    read_depth: "#0f766e"
    suggested_breakpoint: "#16a34a"
    breakpoint_interval: "rgba(22,163,74,0.10)"
