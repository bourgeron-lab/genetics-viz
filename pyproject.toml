[project]
name = "genetics-viz"
version = "0.13.1"
description = "A web-based visualization tool for genetics cohort data"
readme = "README.md"
authors = [{ name = "Freddy Cliquet", email = "fcliquet@pasteur.fr" }]
requires-python = ">=3.12"
dependencies = [
    "nicegui>=2.0.0",
    "plotly>=5.0.0",
    "polars>=1.17,<3",
    "pyyaml>=6.0",
    "typer>=0.12.0",
]
keywords = ["genetics", "visualization", "pedigree", "cohort"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.scripts]
genetics-viz = "genetics_viz.cli:app"

[project.urls]
Homepage = "https://github.com/bourgeron-lab/genetics-viz"
Repository = "https://github.com/bourgeron-lab/genetics-viz"
Issues = "https://github.com/bourgeron-lab/genetics-viz/issues"

[build-system]
requires = ["uv_build>=0.9.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["httpx>=0.27", "pytest>=8.0.0", "pytest-asyncio>=0.24", "ruff>=0.4.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: starts a real server process (deselect with -m 'not slow')",
]
